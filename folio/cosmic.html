<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cosmic — 求职作品集</title>
<style>
:root{--fg:#EEF3FF;--dim:rgba(238,243,255,.55);--blue:#7FA8FF}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#01030A;color:var(--fg);height:100vh;overflow:hidden;position:relative;
  font-family:"Noto Sans SC","Source Han Sans SC",sans-serif}
/* 星云：锥形渐变 + 模糊 + 径向遮罩，纯 CSS，无图片 */
.neb{position:absolute;left:50%;top:-16%;width:1500px;height:1500px;transform:translateX(-50%);
  background:conic-gradient(from 210deg at 50% 50%,#050B18,#2E6BD6,#CFE0FF,#3E7BE0,#0A1428,#1E4C9E,#050B18);
  filter:blur(9px) saturate(1.5) brightness(1.45);
  -webkit-mask-image:radial-gradient(circle at 50% 50%,transparent 21%,#000 32%,#000 46%,rgba(0,0,0,.55) 54%,transparent 63%)}
.core{position:absolute;left:50%;top:8%;width:900px;height:520px;transform:translateX(-50%);
  background:radial-gradient(ellipse at 50% 40%,rgba(150,190,255,.42),transparent 62%);filter:blur(28px)}
.panel{position:absolute;inset:7% 6%;border-radius:22px;z-index:2;
  background:radial-gradient(ellipse at 50% 22%,rgba(2,4,10,.05) 0%,rgba(2,4,10,.55) 46%,rgba(2,4,10,.93) 76%)}
.stars{position:absolute;inset:0;z-index:3;opacity:.7;
  background-image:radial-gradient(1.4px 1.4px at 12% 22%,#fff,transparent),
    radial-gradient(1.2px 1.2px at 28% 68%,#cfe0ff,transparent),
    radial-gradient(1.8px 1.8px at 46% 34%,#fff,transparent),
    radial-gradient(1.1px 1.1px at 63% 74%,#dfe9ff,transparent),
    radial-gradient(1.6px 1.6px at 78% 28%,#fff,transparent),
    radial-gradient(1.2px 1.2px at 88% 58%,#cfe0ff,transparent),
    radial-gradient(1.1px 1.1px at 34% 86%,#fff,transparent)}

nav{position:absolute;z-index:6;left:50%;top:26px;transform:translateX(-50%);display:flex;align-items:center;gap:24px;
  background:rgba(8,12,24,.72);border:1px solid rgba(160,190,255,.18);border-radius:100px;padding:8px 16px 8px 8px;
  backdrop-filter:blur(14px)}
nav .m{width:28px;height:28px;border-radius:50%;border:1px solid rgba(200,220,255,.4);
  display:flex;align-items:center;justify-content:center;font-family:"Mono";font-size:10px}
nav a{color:var(--dim);text-decoration:none;font-size:11.5px}
nav a.on{color:var(--fg)}
nav a:last-child{color:var(--fg)}

.center{position:absolute;z-index:6;left:50%;top:50%;transform:translate(-50%,-52%);text-align:center;width:min(760px,88vw)}
.kick{font-family:"Mono";font-size:9px;letter-spacing:.42em;text-transform:uppercase;color:var(--dim)}
h1{font-family:"Noto Serif SC","Songti SC",serif;font-weight:400;font-size:clamp(44px,7.4vw,104px);
  line-height:1.04;margin-top:16px;font-style:italic}
.sub{margin-top:16px;font-size:14px;color:rgba(238,243,255,.78)}
.sub em{font-style:italic;color:var(--blue)}
p{margin:16px auto 0;font-size:11.5px;line-height:1.95;color:var(--dim);max-width:36em}
.btns{margin-top:28px;display:flex;gap:12px;justify-content:center}
.btn{border-radius:100px;padding:11px 22px;font-size:12px;text-decoration:none;color:var(--fg);
  border:1px solid rgba(200,220,255,.32)}
.btn.solid{background:#EEF3FF;color:#04060B;border-color:#EEF3FF}
.scroll{position:absolute;z-index:6;left:50%;bottom:26px;transform:translateX(-50%);text-align:center;
  font-family:"Mono";font-size:8px;letter-spacing:.44em;color:var(--dim)}
.scroll i{display:block;width:1px;height:22px;background:rgba(200,220,255,.5);margin:10px auto 0}
</style>
</head>
<body>
<div class="core"></div><div class="neb"></div>
<div class="panel"></div>
<div class="stars"></div>

<nav>
  <span class="m">林</span>
  <a class="on" href="#">首页</a><a href="#">作品</a><a href="#">经历</a><a href="mailto:hi@linche.studio">打个招呼 ↗</a>
</nav>

<div class="center">
  <div class="kick">Collection ’26</div>
  <h1>林澈</h1>
  <div class="sub">一个 <em>产品设计师</em>，住在上海。</div>
  <p>做界面，也做前端。把复杂的东西做得安静，把安静的界面做得能被用起来。</p>
  <div class="btns">
    <a class="btn solid" href="#">看作品</a>
    <a class="btn" href="mailto:hi@linche.studio">约面试…</a>
  </div>
</div>

<div class="scroll">Scroll<i></i></div>
</body>
</html>
